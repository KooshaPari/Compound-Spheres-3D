name: release

# Tag release pipeline: build CompoundMeshes, extract changelog, publish GitHub Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v1.0.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore CompoundMeshes.sln

      - name: Build
        run: dotnet build CompoundMeshes.sln -c Release --no-restore

      - name: Test
        run: dotnet test Tests/CompoundMeshes.Tests/ -c Release --no-build --verbosity normal

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "HEAD" ]; then
            TAG="${{ inputs.version }}"
          fi
          VER="${TAG#v}"

          extract_section() {
            local version="$1"
            local file="$2"
            sed -n "/^## \[${version}\]/,/^## \[/p" "$file" | head -n -1 | tail -n +2
          }

          NOTES=$(extract_section "$VER" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release $TAG"
          fi

          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          files: |
            CompoundMeshes/bin/Release/net4.8/CompoundMeshes.dll
            CompoundMeshes/bin/Release/net4.8/CompoundMeshes.pdb
